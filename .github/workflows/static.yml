#
# File name : static.yml
#
# Description :
#     언어별 문서의 일관성을 검사하고 GitHub Pages에 배포한다.
#     Check localized documentation consistency and deploy it to GitHub Pages.
#
# ========================

name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "htmls/**"
      - "docs/Language/i18n/**"
      - "tools/docs/build_locales"
      - "tests/docs/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check documentation languages
        run: |
          python3 tools/docs/build_locales
          python3 tests/docs/locale_tests
          node --test tests/docs/language_tests.cjs
          node --check htmls/js/docs.js
          node --check htmls/js/language.js
          git diff --exit-code -- htmls/ko

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare home page
        run: |
          if [ ! -f htmls/index.html ]; then
            cp htmls/Aevix.html htmls/index.html
          fi

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: htmls

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
