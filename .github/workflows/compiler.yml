#
# File name : compiler.yml
#
# Description :
#     Apple Silicon macOS, 두 Linux CPU와 Windows x86-64의 컴파일러를 검사한다.
#     Check compilers on Apple Silicon macOS, both Linux CPUs, and Windows x86-64.
#
# ========================
name: Compiler
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash tools/setup_linux_build.sh
          echo 'LLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm' >> "$GITHUB_ENV"
          echo 'CC=/usr/bin/clang-22' >> "$GITHUB_ENV"
          echo 'CXX=/usr/bin/clang++-22' >> "$GITHUB_ENV"
      - name: Install macOS toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm@22 cmake ninja
          echo "LLVM_DIR=$(brew --prefix llvm@22)/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "CC=$(brew --prefix llvm@22)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm@22)/bin/clang++" >> "$GITHUB_ENV"
          echo 'MACOSX_DEPLOYMENT_TARGET=26.0' >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="$LLVM_DIR" -DAEVIX_CLANG_EXECUTABLE="$CC"
      - name: Build
        run: cmake --build build --parallel 3
      - name: Test analysis, AOT, JIT, runtime, and installation
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cpack --config build/CPackConfig.cmake -B build/packages
      - uses: actions/upload-artifact@v7
        with:
          name: aevix-${{ matrix.runner }}
          path: build/packages/*.tar.gz
          if-no-files-found: error
  windows-aot:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Configure Windows x86-64 with the installed Clang toolchain
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere is unavailable on this runner.' }
          $instancesJson = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot query the installed Visual Studio C++ toolchain.' }
          $instance = @($instancesJson | ConvertFrom-Json)[0]
          if (-not $instance) { throw 'No installed Visual Studio x86/x64 C++ toolchain was found.' }
          $major = ([version]$instance.installationVersion).Major
          $capabilitiesJson = & cmake -E capabilities
          if ($LASTEXITCODE -ne 0) { throw 'Cannot query CMake generators.' }
          $capabilities = $capabilitiesJson | ConvertFrom-Json
          $generators = @($capabilities.generators | Where-Object { $_.name -match "^Visual Studio $major " })
          if ($generators.Count -ne 1) { throw "CMake does not provide one generator for installed Visual Studio $major." }
          $generator = $generators[0].name
          $clangCandidates = @(& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\Llvm\x64\bin\clang.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot query the installed Visual Studio Clang driver.' }
          $pathClang = Get-Command clang.exe -ErrorAction SilentlyContinue
          if ($pathClang) { $clangCandidates += $pathClang.Source }
          $clang = $clangCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $clang) { throw 'No installed Clang driver was found.' }
          $clang = $clang.Replace('\', '/')
          Write-Host "Configuring with $generator at $($instance.installationPath), Clang: $clang"
          $configureArgs = @('-S', '.', '-B', 'build', '-G', $generator, '-A', 'x64',
            "-DCMAKE_GENERATOR_INSTANCE=$($instance.installationPath)", '-DAEVIX_ENABLE_JIT=OFF',
            "-DAEVIX_CLANG_EXECUTABLE=$clang")
          & cmake @configureArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test Windows frontend, AOT, runtime, and installation
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows x86-64
        run: cpack --config build/CPackConfig.cmake -C Release -B build/packages
      - uses: actions/upload-artifact@v7
        with:
          name: aevix-windows-x86_64-aot
          path: build/packages/*.zip
          if-no-files-found: error
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: bash tools/setup_linux_build.sh
      - name: Configure with sanitizers
        run: >-
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=/usr/bin/clang-22 -DCMAKE_CXX_COMPILER=/usr/bin/clang++-22
          -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm -DAEVIX_CLANG_EXECUTABLE=/usr/bin/clang-22
          '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -Werror'
      - run: cmake --build build-sanitize --parallel 3
      - run: ctest --test-dir build-sanitize --output-on-failure
